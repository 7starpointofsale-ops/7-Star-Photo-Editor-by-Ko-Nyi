name: myanmar_photo_editor
description: Privacy-first Myanmar passport and licence photo editor.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  http: ^1.2.2
  image: ^4.2.0
  archive: ^4.0.7
  pdf: ^3.13.0
  pdfx: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
